    <!--
      Preload the LCP element: first hero slideshow image.
      This lets the browser fetch it in parallel with JS, dramatically
      reducing Largest Contentful Paint time.
    -->
    <link
      rel="preload"
      as="image"
      href="/portfolio/signature-outdoor-01.jpg"
      fetchpriority="high"
    />

    <!--
      Resource hints: open connections to the font + asset CDNs early.
      dns-prefetch is the fallback for browsers that ignore preconnect.
    -->
    <link rel="preconnect" href="https://cdn.prod.website-files.com" />
    <link rel="dns-prefetch" href="https://cdn.prod.website-files.com" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

    <!-- Fonts: Cormorant Garamond (display) + Barlow (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Non-blocking font load: media="print" loads the CSS off the critical path,
      then onload swaps it to "all" so fonts display once ready.
      The <noscript> fallback covers JS-disabled environments.
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Barlow:wght@300;400;500;600&family=Barlow+Condensed:wght@400;500;600;700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Barlow:wght@300;400;500;600&family=Barlow+Condensed:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Barlow:wght@300;400;500;600&family=Barlow+Condensed:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>

    <!--
      Netlify Forms registration. Netlify's build-time HTML scanner only
      registers forms it can see in static HTML — React-rendered forms in
      the SPA bundle are invisible to it, so submissions to "/" would 404
      silently. Each <form> below mirrors the field set of its live React
      counterpart so submissions are accepted and routed to the dashboard.
      Hidden via display:none but still parsed at build time.
    -->
    <div hidden aria-hidden="true">
      <form
        name="project-inquiry"
        data-netlify="true"
        netlify-honeypot="bot-field"
      >
        <input type="text" name="name" />
        <input type="email" name="email" />
        <input type="tel" name="phone" />
        <input type="text" name="budget" />
        <select name="projectType"></select>
        <textarea name="message"></textarea>
        <input type="text" name="bot-field" />
      </form>

      <form
        name="estimator-lead"
        data-netlify="true"
        netlify-honeypot="bot-field"
      >
        <input type="text" name="name" />
        <input type="email" name="email" />
        <input type="tel" name="phone" />
        <input type="text" name="projectType" />
        <input type="text" name="complexity" />
        <input type="text" name="sqft" />
        <input type="text" name="estimatedMid" />
        <input type="text" name="bot-field" />
      </form>

      <!--
        Per-service inquiry forms. Form names match the slug produced by
        client/src/pages/services/_template.tsx (formName). Keep in sync
        when adding/renaming a service.
      -->
      <form
        name="residential-construction-inquiry"
        data-netlify="true"
        netlify-honeypot="bot-field"
      >
        <input type="text" name="name" />
        <input type="email" name="email" />
        <input type="tel" name="phone" />
        <input type="text" name="service" />
        <textarea name="message"></textarea>
        <input type="text" name="bot-field" />
      </form>

      <form
        name="remodels-renovations-inquiry"
        data-netlify="true"
        netlify-honeypot="bot-field"
      >
        <input type="text" name="name" />
        <input type="email" name="email" />
        <input type="tel" name="phone" />
        <input type="text" name="service" />
        <textarea name="message"></textarea>
        <input type="text" name="bot-field" />
      </form>

      <form
        name="new-construction-inquiry"
        data-netlify="true"
        netlify-honeypot="bot-field"
      >
        <input type="text" name="name" />
        <input type="email" name="email" />
        <input type="tel" name="phone" />
        <input type="text" name="service" />
        <textarea name="message"></textarea>
        <input type="text" name="bot-field" />
      </form>

      <form
        name="restoration-inquiry"
        data-netlify="true"
        netlify-honeypot="bot-field"
      >
        <input type="text" name="name" />
        <input type="email" name="email" />
        <input type="tel" name="phone" />
        <input type="text" name="service" />
        <textarea name="message"></textarea>
        <input type="text" name="bot-field" />
      </form>

      <form
        name="outdoor-spaces-inquiry"
        data-netlify="true"
        netlify-honeypot="bot-field"
      >
        <input type="text" name="name" />
        <input type="email" name="email" />
        <input type="tel" name="phone" />
        <input type="text" name="service" />
        <textarea name="message"></textarea>
        <input type="text" name="bot-field" />

      <form

        <input type="text" name="name" />
        <input type="email" name="email" />
        <input type="tel" name="phone" />

      >
        <input type="text" name="name" />
        <input type="email" name="email" />
        <input type="tel" name="phone" />
        <input type="text" name="service" />
        <textarea name="message"></textarea>
        <input type="text" name="bot-field" />
      </form>

        data-netlify="true"
        netlify-honeypot="bot-field"
      >
        <input type="text" name="name" />
        <input type="email" name="email" />
        <input type="tel" name="phone" />
        <input type="text" name="service" />
