    <!--
      Preload the LCP element: first hero slideshow image.
      This lets the browser fetch it in parallel with JS, dramatically
      reducing Largest Contentful Paint time.
    -->
    <link
      rel="preload"
      as="image"
      href="/portfolio/signature-outdoor-01.jpg"
      fetchpriority="high"
    />

    <!-- Fonts: Cormorant Garamond (display) + Barlow (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Non-blocking font load: media="print" loads the CSS off the critical path,
      then onload swaps it to "all" so fonts display once ready.
      The <noscript> fallback covers JS-disabled environments.
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Barlow:wght@300;400;500;600&family=Barlow+Condensed:wght@400;500;600;700&display=swap"
    />

      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Barlow:wght@300;400;500;600&family=Barlow+Condensed:wght@400;500;600;700&display=swap"
