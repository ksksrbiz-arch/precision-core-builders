    <!--
      Branded loading screen — critical CSS, inlined so it paints before any
      bundle or stylesheet arrives. These .pcb-loader* rules are shared with
      the <BrandLoader /> React component (client/src/components/BrandLoader.tsx),
      whose markup mirrors the static splash inside #root below, so the hand-off
      from splash to React is seamless. Colours are the fixed brand palette
      (not theme tokens) because this renders before the theme exists.
    -->
    <style>
      html,
      body {
        margin: 0;
        background: #0c0a08;
      }
      .pcb-loader {
        position: relative;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        min-height: 100vh;
        min-height: 100dvh;
        padding: 24px;
        background: #0c0a08;
        color: #ede6d9;
        font-family:
          "Barlow",
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      .pcb-loader__logo {
        display: block;
        width: 149px;
        height: 56px;
      }
      .pcb-loader__bar {
        position: relative;
        width: 148px;
        height: 2px;
        overflow: hidden;
        background: rgba(200, 168, 75, 0.18);
      }
      .pcb-loader__bar > span {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 40%;
        background: #c8a84b;
        animation: pcb-loader-slide 1.4s cubic-bezier(0.45, 0, 0.25, 1) infinite;
      }
      .pcb-loader__sr {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .pcb-loader__note {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 12vh;
        padding: 0 24px;
        text-align: center;
        font-size: 14px;
        line-height: 1.6;
        color: #a89f8d;
      }
      .pcb-loader__note a {
        color: #c8a84b;
      }
      @keyframes pcb-loader-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .pcb-loader__bar > span {
          animation: none;
          width: 100%;
          opacity: 0.55;
        }
      }
    </style>

    <!--

      This lets the browser fetch it in parallel with JS, dramatically

    <!--
      Non-blocking font load: media="print" loads the CSS off the critical path,
      then onload swaps it to "all" so fonts display once ready.
      The <noscript> fallback covers JS-disabled environments.
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Barlow:wght@300;400;500;600&family=Barlow+Condensed:wght@400;500;600;700&display=swap"

      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"

        rel="stylesheet"
      />
    </noscript>

            or call us at <a href="tel:+15418525144">541-852-5144</a>.
          </p>
        </noscript>
        <p class="pcb-loader__note" id="pcb-slow" hidden>
          Still loading — this is taking longer than usual.
          <a
            href=""
            onclick="
              location.reload();
              return false;
            "
            >Reload</a
          >
          or call <a href="tel:+15418525144">541-852-5144</a>.
        </p>
      </div>
    </div>
    <script>
      // If the app bundle never replaces the splash (blocked script, stale
      // deploy, flaky network), say so after 12s instead of spinning forever.
      setTimeout(function () {
        var note = document.getElementById("pcb-slow");
        if (note) note.hidden = false;
      }, 12000);
    </script>

    <!--
      Netlify Forms registration. Netlify's build-time HTML scanner only
      registers forms it can see in static HTML — React-rendered forms in
      the SPA bundle are invisible to it, so submissions to "/" would 404

      counterpart so submissions are accepted and routed to the dashboard.
      Hidden via display:none but still parsed at build time.
    -->
