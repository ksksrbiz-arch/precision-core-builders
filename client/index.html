    <!--
      Branded loading screen — critical CSS, inlined so it paints before any
      bundle or stylesheet arrives. These .pcb-loader* rules are shared with

      whose markup mirrors the static splash inside #root below, so the hand-off
      from splash to React is seamless. Colours are the fixed brand palette

    -->
    <style>
      html,
      body {
        margin: 0;
        background: #0c0a08;
      }
      .pcb-loader {
        position: relative;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        min-height: 100vh;
        min-height: 100dvh;
        padding: 24px;
        background: #0c0a08;
        color: #ede6d9;
        font-family:
          "Barlow",

          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      .pcb-loader__logo {
        display: block;
        width: 145px;
        height: 56px;
      }
      .pcb-loader__bar {
        position: relative;
        width: 148px;
        height: 2px;
        overflow: hidden;
        background: rgba(200, 168, 75, 0.18);
      }
      .pcb-loader__bar > span {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 40%;
        background: #c8a84b;
        animation: pcb-loader-slide 1.4s cubic-bezier(0.45, 0, 0.25, 1) infinite;
      }
      .pcb-loader__sr {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .pcb-loader__note {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 12vh;
        padding: 0 24px;
        text-align: center;
        font-size: 14px;
        line-height: 1.6;
        color: #a89f8d;
      }
      .pcb-loader__note a {
        color: #c8a84b;
      }
      @keyframes pcb-loader-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .pcb-loader__bar > span {
          animation: none;
          width: 100%;
          opacity: 0.55;
        }
