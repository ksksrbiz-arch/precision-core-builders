name: "Security Audit & Auto-Fix"

on:
  # Run every Monday at 6 AM Pacific
  schedule:
    - cron: "0 13 * * 1"
  # Also run on-demand from GitHub UI
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  audit-and-fix:
    name: Audit dependencies & auto-patch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Phase 1: Audit ──────────────────────────────────────
      - name: Run security audit
        id: audit
        run: |
          set +e
          AUDIT_OUTPUT=$(pnpm audit 2>&1)
          AUDIT_EXIT=$?
          echo "$AUDIT_OUTPUT"

          # Count vulnerabilities
          VULN_LINE=$(echo "$AUDIT_OUTPUT" | grep "vulnerabilities found" || echo "0 vulnerabilities found")
          echo "audit_result=$VULN_LINE" >> "$GITHUB_OUTPUT"
          echo "audit_exit=$AUDIT_EXIT" >> "$GITHUB_OUTPUT"

          if [ "$AUDIT_EXIT" -eq 0 ]; then
            echo "status=clean" >> "$GITHUB_OUTPUT"
          else
            echo "status=vulnerable" >> "$GITHUB_OUTPUT"
          fi

      # ── Phase 2: Auto-fix if vulnerabilities found ──────────
      - name: Attempt auto-fix
        if: steps.audit.outputs.status == 'vulnerable'
        id: fix
        run: |
          echo "::group::Updating direct dependencies"
          pnpm update --latest 2>&1 || true
          echo "::endgroup::"

          echo "::group::Verifying build"
          if pnpm build 2>&1; then
            echo "build_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "build_ok=false" >> "$GITHUB_OUTPUT"
            echo "::error::Build failed after dependency update — rolling back"
            git checkout -- package.json pnpm-lock.yaml
            pnpm install --frozen-lockfile
          fi
          echo "::endgroup::"

      - name: Re-audit after fix
        if: steps.audit.outputs.status == 'vulnerable' && steps.fix.outputs.build_ok == 'true'
        id: reaudit
        run: |
          set +e
          AUDIT_OUTPUT=$(pnpm audit 2>&1)
          AUDIT_EXIT=$?
          echo "$AUDIT_OUTPUT"
          VULN_LINE=$(echo "$AUDIT_OUTPUT" | grep "vulnerabilities found" || echo "0 vulnerabilities found")
          echo "reaudit_result=$VULN_LINE" >> "$GITHUB_OUTPUT"

          if [ "$AUDIT_EXIT" -eq 0 ]; then
            echo "status=clean" >> "$GITHUB_OUTPUT"
          else
            echo "status=remaining" >> "$GITHUB_OUTPUT"
          fi

      # ── Phase 3: Create PR with fixes ───────────────────────
      - name: Check for changes
        if: steps.audit.outputs.status == 'vulnerable' && steps.fix.outputs.build_ok == 'true'
        id: diff
        run: |
          if git diff --quiet package.json pnpm-lock.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create fix branch and PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="auto/security-patch-$(date +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Create branch, commit, push
          git checkout -b "$BRANCH"
          git add package.json pnpm-lock.yaml
          git commit -m "security: automated dependency patch $(date +%Y-%m-%d)

          Before: ${{ steps.audit.outputs.audit_result }}
          After:  ${{ steps.reaudit.outputs.reaudit_result }}

          Auto-generated by security-audit workflow."

          git push origin "$BRANCH"

          # Create PR
          BODY="## Automated Security Patch

          **Audit before fix:** ${{ steps.audit.outputs.audit_result }}
          **Audit after fix:** ${{ steps.reaudit.outputs.reaudit_result }}

          ### What happened
          The weekly \`pnpm audit\` found vulnerabilities. This PR updates dependencies to their latest compatible versions and confirms the build still passes.

          ### Checklist
          - [x] \`pnpm audit\` ran
          - [x] \`pnpm update --latest\` applied
          - [x] \`pnpm build\` verified
          - [ ] Manual review (merge when ready)

          > Auto-generated by [security-audit.yml](/.github/workflows/security-audit.yml)"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "security: automated dependency patch $(date +%Y-%m-%d)" \
            --body "$BODY" \
            --label "dependencies,automated,security"

      # ── Phase 4: Alert if unfixable ─────────────────────────
      - name: Alert on unfixable vulnerabilities
        if: steps.reaudit.outputs.status == 'remaining'
        run: |
          echo "::warning::Some vulnerabilities could not be auto-fixed. Manual intervention required."
          echo "Remaining: ${{ steps.reaudit.outputs.reaudit_result }}"
