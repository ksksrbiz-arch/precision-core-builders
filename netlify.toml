[build]
  base = "/"
  publish = "dist/public"
  command = "pnpm install --prod=false && pnpm build"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "10.4.1"
  # ─────────────────────────────────────────────────────────────────────────────
  # AWS Lambda imposes a hard 4 KB limit on total environment-variable payload.
  # Variables set in [build.environment] (here) are available ONLY during the
  # build step — they are NEVER forwarded to Netlify Functions. Use this section
  # for all non-secret, build-time-only values so the per-function payload stays
  # well under 4 KB.
  #
  # Secret values (Supabase keys, API keys) MUST be set in the Netlify dashboard
  # (Site → Environment variables).  In the dashboard, set their "Scope" to:
  #   • "Builds" — for VITE_* and other build-only vars
  #   • "Functions" (or "All") — only for vars your Lambda functions read at runtime
  #
  # Dashboard vars that Lambda functions need at runtime (keep scope = All):
  #   ADMIN_EMAIL, ADMIN_PASSWORD, ADMIN_SESSION_TOKEN  ← simple admin login
  #   AUTH0_DOMAIN, AUTH0_CLIENT_ID, AUTH0_CLIENT_SECRET  ← optional Auth0 SSO
  #   SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY,
  #   SUPABASE_JWT_SECRET, SUPABASE_DATABASE_URL,
  #   ANTHROPIC_API_KEY, OPENAI_API_KEY, GOOGLE_AI_API_KEY,
  #   OPENWEATHERMAP_API_KEY, N8N_WEBHOOK_URL, N8N_API_KEY,
  #   STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET,
  #   BLUEPRINT_ENCRYPTION_KEY, BLUEPRINT_CLIENT_ID, BLUEPRINT_CLIENT_SECRET
  #
  # Dashboard vars that should be scoped to "Builds" only:
  #   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, VITE_STRIPE_PUBLISHABLE_KEY
  #   VITE_AUTH0_DOMAIN, VITE_AUTH0_CLIENT_ID
  #   STRIPE_PUBLISHABLE_KEY, BLUEPRINT_BASE_URL, BLUEPRINT_API_BASE_URL
  #
  # Run `node scripts/check-env-size.js` locally to estimate your payload size.
  # ─────────────────────────────────────────────────────────────────────────────

  # Non-secret feature flags — keep here, remove from dashboard entirely
  VITE_FEATURE_BLUEPRINT = "false"
  VITE_DEV_MODE = "false"

  # Build tooling flags — keep here, remove from dashboard entirely
  TAILWINDCSS_DISABLE_OXIDE = "1"
  NODE_ENV = "production"

# ── Custom domain redirect ───────────────────────────────────
# After Eric sets up a custom domain, uncomment the block below
# and replace <your-domain> with the actual domain so that the
# www subdomain permanently redirects to the apex.
# Netlify provisions the SSL certificate for both automatically.
#
# [[redirects]]
#   from   = "https://www.<your-domain>/*"
#   to     = "https://<your-domain>/:splat"
#   status = 301
#   force  = true
# ────────────────────────────────────────────────────────────

# Redirect API calls to serverless functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Static files — serve directly, don't redirect to SPA
[[redirects]]
  from = "/sw.js"
  to = "/sw.js"
  status = 200

[[redirects]]
  from = "/manifest.json"
  to = "/manifest.json"
  status = 200

[[redirects]]
  from = "/offline.html"
  to = "/offline.html"
  status = 200

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

# Legacy / common-typo URL redirects → canonical paths (301).
# Must be declared BEFORE the SPA catch-all so they take precedence.
[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/work"
  to = "/portfolio"
  status = 301

[[redirects]]
  from = "/projects"
  to = "/portfolio"
  status = 301

[[redirects]]
  from = "/team"
  to = "/about"
  status = 301

[[redirects]]
  from = "/quote"
  to = "/estimator"
  status = 301

[[redirects]]
  from = "/estimate"
  to = "/estimator"
  status = 301

# Redirect all other traffic to index.html for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Functions configuration
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Development server configuration
[dev]
  command = "pnpm dev"
  port = 3000
  targetPort = 3000
  autoLaunch = false

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Strict Transport Security (HSTS) - force HTTPS for 1 year
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Content Security Policy - prevent XSS and injection attacks
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://maps.googleapis.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.auth0.com https://api.openweathermap.org https://api.anthropic.com https://blueprint.am https://api.blueprint.am; frame-src 'self' https://superspl.at https://supersplat-demo.vercel.app; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    # Allow mic (voice reports), camera (site cam), geolocation (weather/site)
    # Uses structured-header syntax required by Chromium 116+
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(self), interest-cohort=()"
    # Legacy Feature-Policy fallback for older WebView / Safari < 16
    Feature-Policy = "camera 'self'; microphone 'self'; geolocation 'self'"

# PWA manifest — don't cache aggressively (needs to update)
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/manifest+json"

# Service worker — MUST not be cached long
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

# Icons — cache for a week
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Context-specific build configurations
# NODE_ENV = "production" is now set in [build.environment] above.
[context.deploy-preview]
  environment = { NODE_ENV = "development" }

[context.branch-deploy]
  environment = { NODE_ENV = "development" }
