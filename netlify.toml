[build]
  base = "/"
  publish = "dist/public"
  command = "pnpm install && pnpm build"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "10.4.1"

# ── Custom domain redirect ───────────────────────────────────
# After Eric sets up a custom domain, uncomment the block below
# and replace <your-domain> with the actual domain so that the
# www subdomain permanently redirects to the apex.
# Netlify provisions the SSL certificate for both automatically.
#
# [[redirects]]
#   from   = "https://www.<your-domain>/*"
#   to     = "https://<your-domain>/:splat"
#   status = 301
#   force  = true
# ────────────────────────────────────────────────────────────

# Redirect API calls to serverless functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Static files — serve directly, don't redirect to SPA
[[redirects]]
  from = "/sw.js"
  to = "/sw.js"
  status = 200

[[redirects]]
  from = "/manifest.json"
  to = "/manifest.json"
  status = 200

[[redirects]]
  from = "/offline.html"
  to = "/offline.html"
  status = 200

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

# Redirect all other traffic to index.html for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Functions configuration
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Development server configuration
[dev]
  command = "pnpm dev"
  port = 3000
  targetPort = 3000
  autoLaunch = false

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Strict Transport Security (HSTS) - force HTTPS for 1 year
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Content Security Policy - prevent XSS and injection attacks
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://maps.googleapis.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://*.supabase.co https://api.openweathermap.org https://api.anthropic.com https://blueprint.am https://api.blueprint.am; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    # Allow mic (voice reports), camera (site cam), geolocation (weather/site)
    # Uses structured-header syntax required by Chromium 116+
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(self), interest-cohort=()"
    # Legacy Feature-Policy fallback for older WebView / Safari < 16
    Feature-Policy = "camera 'self'; microphone 'self'; geolocation 'self'"

# PWA manifest — don't cache aggressively (needs to update)
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/manifest+json"

# Service worker — MUST not be cached long
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

# Icons — cache for a week
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Context-specific build configurations
[context.production]
  environment = { NODE_ENV = "production" }

[context.deploy-preview]
  environment = { NODE_ENV = "development" }

[context.branch-deploy]
  environment = { NODE_ENV = "development" }

