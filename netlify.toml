[build]
  base = "/"
  publish = "dist/public"
  command = "corepack enable && corepack prepare pnpm@10.4.1 --activate && pnpm install && pnpm build"

[build.environment]
  NODE_VERSION = "20"
  COREPACK_ENABLE_STRICT = "0"
  PNPM_FLAGS = "--shamefully-hoist"

# Redirect API calls to serverless functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# PWA files — serve directly, don't redirect to SPA
[[redirects]]
  from = "/sw.js"
  to = "/sw.js"
  status = 200

[[redirects]]
  from = "/manifest.json"
  to = "/manifest.json"
  status = 200

[[redirects]]
  from = "/offline.html"
  to = "/offline.html"
  status = 200

# Redirect all other traffic to index.html for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Functions configuration
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Development server configuration
[dev]
  command = "pnpm dev"
  port = 3000
  targetPort = 3000
  autoLaunch = false

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Allow mic (voice reports), camera (site cam), geolocation (weather/site)
    # Uses structured-header syntax required by Chromium 116+
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(self), interest-cohort=()"
    # Legacy Feature-Policy fallback for older WebView / Safari < 16
    Feature-Policy = "camera 'self'; microphone 'self'; geolocation 'self'"

# PWA manifest — don't cache aggressively (needs to update)
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/manifest+json"

# Service worker — MUST not be cached long
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

# Icons — cache for a week
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Context-specific build configurations
[context.production]
  environment = { NODE_ENV = "production" }

[context.deploy-preview]
  environment = { NODE_ENV = "development" }

[context.branch-deploy]
  environment = { NODE_ENV = "development" }

